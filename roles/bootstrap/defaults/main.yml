---
# defaults file for bootstrap
bootstrap_file_path:
  ansible_fact: "/etc/ansible/facts.d/raspberrypi.fact"


bootstrap_sysctl_settings:
  inotify:
    max_user_instances: 512
    max_user_watches: 524288
    max_queued_events: 32768
  net:
    ipv4_ip_forward: 1
    ipv6_conf_all_forwarding: 1
    bridge_bridge_nf_call_iptables: 1
    bridge_bridge_nf_call_ip6tables: 1
    ipv4_conf_all_rp_filter: 0
